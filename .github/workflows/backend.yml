name: Backend Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            if [ -d "$HOME/wedraw/.git" ]; then
              echo "Repository already exists"
              cd $HOME/wedraw
              git pull origin main
            else
              echo "First deployment: cloning repository"
              cd $HOME
              git clone https://github.com/Nishantkumar012/wedraw.git
              cd $HOME/wedraw
            fi

            echo "Go to backend"
            cd backend

            echo "Set environment variables"
            cat > .env << 'ENVEOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ENVEOF

            echo "Free up memory"
            sudo sync && sudo sysctl -w vm.drop_caches=3

            echo "Install dependencies (production only, with fallback)"
            npm install --legacy-peer-deps --omit=dev || npm ci --omit=dev

            echo "Node and npm versions:"
            node -v
            npm -v

            echo "Build TypeScript (includes Prisma generate)"
            NODE_OPTIONS="--max-old-space-size=512" npm run build

            echo "Run database migrations"
            npx prisma migrate deploy

            echo "Stopping old backend process"
            pm2 delete backend || true

            echo "Starting backend with PM2"
            pm2 start dist/index.js --name backend --node-args="--max-old-space-size=512"

            echo "Save PM2 process"
            pm2 save
            pm2 startup